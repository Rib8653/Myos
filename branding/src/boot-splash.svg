<?xml version="1.0" encoding="UTF-8"?>
<!-- RibOS boot menu background, used by GRUB (UEFI, 800x600) and isolinux
     (BIOS, 640x480). Original artwork, CC0. The lower half stays dark so the
     menu entries drawn on top remain readable. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1024"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="640" cy="120" r="200" fill="#6366F1" opacity="0.35" filter="url(#glow)"/>
  <circle cx="120" cy="520" r="180" fill="#22D3EE" opacity="0.18" filter="url(#glow)"/>
  <image href="logo.svg" x="268" y="110" width="92" height="92"/>
  <text x="378" y="182" font-family="Inter" font-weight="600" font-size="64" fill="#FFFFFF">RibOS</text>
  <text x="400" y="248" text-anchor="middle" font-family="Inter" font-size="18" fill="#A5B4FC">Familiar desktop · Debian inside</text>
</svg>
