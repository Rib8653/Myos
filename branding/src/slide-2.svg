<?xml version="1.0" encoding="UTF-8"?>
<!-- RibOS installer slide. Original artwork, CC0. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="440" viewBox="0 0 800 440">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF4FF"/><stop offset="1" stop-color="#DCE6FF"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#6366F1"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.18"/></filter></defs>
<rect width="800" height="440" rx="24" fill="url(#bg)"/>
<!-- a stylised screen -->
<g filter="url(#sh)">
  <rect x="120" y="40" width="560" height="330" rx="16" fill="#FFFFFF"/>
</g>
<rect x="120" y="40" width="560" height="290" rx="16" fill="url(#acc)" opacity="0.18"/>
<!-- two snapped windows -->
<rect x="140" y="60" width="255" height="250" rx="10" fill="#FFFFFF" stroke="#C7D2FE"/>
<rect x="140" y="60" width="255" height="28" rx="10" fill="#EEF2FF"/>
<rect x="405" y="60" width="255" height="250" rx="10" fill="#FFFFFF" stroke="#C7D2FE"/>
<rect x="405" y="60" width="255" height="28" rx="10" fill="#EEF2FF"/>
<g fill="#9CA3AF"><circle cx="372" cy="74" r="4"/><circle cx="358" cy="74" r="4"/><circle cx="344" cy="74" r="4"/><circle cx="637" cy="74" r="4"/><circle cx="623" cy="74" r="4"/><circle cx="609" cy="74" r="4"/></g>
<g fill="#E5E7EB"><rect x="160" y="110" width="200" height="12" rx="6"/><rect x="160" y="134" width="160" height="12" rx="6"/><rect x="160" y="158" width="180" height="12" rx="6"/><rect x="425" y="110" width="210" height="110" rx="8"/></g>
<!-- taskbar with centered icons -->
<rect x="120" y="330" width="560" height="40" fill="#F8FAFC"/>
<rect x="120" y="354" width="560" height="16" rx="0" fill="#F8FAFC"/>
<image href="logo.svg" x="324" y="337" width="26" height="26"/>
<g><rect x="358" y="337" width="26" height="26" rx="7" fill="#F59E0B"/><rect x="392" y="337" width="26" height="26" rx="7" fill="#3B82F6"/><rect x="426" y="337" width="26" height="26" rx="7" fill="#10B981"/><rect x="460" y="337" width="26" height="26" rx="7" fill="#8B5CF6"/></g>
<text x="660" y="356" text-anchor="end" font-family="Inter" font-size="12" fill="#374151">10:42</text>
<text x="400" y="414" text-anchor="middle" font-family="Inter" font-weight="600" font-size="24" fill="#111827">Feels familiar from the first click</text>
</svg>
