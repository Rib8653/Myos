set default=0

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    # PC-only video drivers (these modules don't exist in arm64 GRUB)
    if [ "${grub_cpu}" = "x86_64" -o "${grub_cpu}" = "i386" ]; then
        insmod efi_uga
        insmod video_bochs
        insmod video_cirrus
    fi
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm


set timeout=5
